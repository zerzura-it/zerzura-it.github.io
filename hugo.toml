baseURL = "https://www.zerzura.it/"
languageCode = "it-IT"
defaultContentLanguage = "it"
title = "Zerzura"
timeZone = "Europe/Rome"
# Blogger distingueva maiuscole e minuscole (es. /search/label/Nuvole)
disablePathToLower = true
enableRobotsTXT = true
capitalizeListTitles = false

# i post nuovi diventano file .html come quelli di Blogger (vedi permalinks)
[uglyURLs]
posts = true

[params]
  description = "un viaggio, una ricerca, un'avventura"
  author = "Emanuele"
  # aboutme = "http://about.me/emanuelecisbani"

[pagination]
  pagerSize = 7
  path = "pagina"

[taxonomies]
  tag = "tags"

# Stessi indirizzi di Blogger per le etichette; i post hanno "url" nel front matter
[permalinks]
  # i post nuovi avranno indirizzi come quelli di Blogger: /2026/11/nome-del-file.html
  [permalinks.page]
    posts = "/:year/:month/:contentbasename"
  [permalinks.term]
    tags = "/search/label/:slug/"
  [permalinks.taxonomy]
    tags = "/etichette/"

[outputs]
  home = ["html", "rss"]
  section = ["html"]
  taxonomy = ["html"]
  term = ["html", "rss"]

[outputFormats.rss]
  baseName = "feed"

[services.rss]
  limit = -1

[markup.goldmark.renderer]
  # i post importati contengono <figure> in HTML
  unsafe = true

[markup.goldmark.parser.attribute]
  # permette {.destra} sotto un paragrafo (epigrafi allineate a destra)
  block = true

[markup.goldmark.extensions.typographer]
  disable = true

[menus]
  [[menus.main]]
    name = "Home page"
    pageRef = "/"
    weight = 1
  [[menus.main]]
    name = "Darash"
    url = "/2013/06/una-bella-pretesa.html"
    weight = 2
  [[menus.main]]
    name = "Nuvole"
    url = "/p/blog-page.html"
    weight = 3
  [[menus.main]]
    name = "Stelle"
    url = "/p/stelle.html"
    weight = 4
  [[menus.main]]
    name = "Archivio"
    url = "/archivio/"
    weight = 5

[markup.goldmark.extensions.footnote]
  # le note di post diversi mostrati nella stessa pagina (home, etichette) non si confondono
  enableAutoIDPrefix = true
