{{ define "main" }}
  <p class="avviso">Post con etichetta <strong>{{ .Title }}</strong></p>
  {{ $pag := .Paginate .Pages }}
  {{ range $pag.Pages }}
    {{ partial "post.html" (dict "pagina" . "condividi" true) }}
  {{ end }}
  <nav class="paginazione" aria-label="Altre pagine">
    {{ with $pag.Prev }}<a href="{{ .URL }}">← Post più recenti</a>{{ end }}
    {{ with $pag.Next }}<a class="dopo" href="{{ .URL }}">Post più vecchi →</a>{{ end }}
  </nav>
{{ end }}
