{{ define "main" }}
  <h1 class="titolo-post">{{ .Title }}</h1>
  {{ range (where site.RegularPages "Section" "posts").GroupByDate "2006" }}
    <section class="archivio" id="{{ .Key }}">
      <h2>{{ .Key }}</h2>
      <ul class="elenco">
        {{ range .Pages }}
          <li><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format "2 January" }}</time> <a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
        {{ end }}
      </ul>
    </section>
  {{ end }}
{{ end }}
