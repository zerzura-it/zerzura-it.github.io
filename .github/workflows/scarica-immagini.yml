# Da lanciare una volta a mano (Actions → "Scarica le immagini rimaste su Blogger" → Run workflow)
name: Scarica le immagini rimaste su Blogger

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scarica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scarica le immagini e aggiorna i post
        run: python3 scripts/scarica_immagini.py || echo "::warning::Alcune immagini non sono state scaricate, vedi il log"
      - name: Salva le modifiche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/images content
          git diff --cached --quiet && echo "Niente da salvare" || git commit -m "Scarica le immagini rimaste sui server di Blogger"
          git push
