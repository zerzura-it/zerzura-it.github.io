# Costruisce il sito con Hugo e lo pubblica su GitHub Pages a ogni modifica di main
name: Pubblica il sito

on:
  push:
    branches: [main]
  workflow_dispatch:
  # riparte anche dopo lo scaricamento delle immagini (i commit fatti dalle Action non lo farebbero da soli)
  workflow_run:
    workflows: ["Scarica le immagini rimaste su Blogger"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.152.2
      HUGO_ENVIRONMENT: production
      TZ: Europe/Rome
    steps:
      - name: Installa Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Scarica il sito
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Configura Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Costruisci con Hugo
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Carica il risultato
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
